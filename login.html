<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <!-- CSS de Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- El CSS de tus componentes (Toasts, Modales, etc.) -->
    <link rel="stylesheet" href="css/componente.css">    
    <link rel="icon" type="image/png" href="img/image.png">
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">

    <div class="contenedor-formulario card shadow p-4" style="width: 100%; max-width: 400px;">
        <h1 class="h3 text-center mb-4">Iniciar Sesión</h1>
        
        <form id="loginForm" class="formulario">
            <div class="grupo-formulario mb-3">
                <label for="correo" class="form-label">Correo electrónico</label>
                <input type="text" id="correo" class="form-control" required>
            </div>
            
            <div class="grupo-formulario mb-3">
                <label for="password" class="form-label">Contraseña</label>
                <input type="password" id="password" class="form-control" required>
            </div>
            
            <button type="submit" class="BInicio btn btn-primary w-100">
                Ingresar
            </button>
        </form>
    </div>
    
    <!-- Scripts externos -->
    <script src="https://cdn.jsdelivr.net/gh/sarailunacenobio05-cpu/Actividad-2-Utileria.js/js/utileria.js"></script>
    <script src="js/componente.js"></script>
    
    <!-- Tu lógica de validación -->
    <script>
    const loginForm = document.getElementById('loginForm');

    loginForm.addEventListener('submit', function(evento) {
        evento.preventDefault();

        const correo = document.getElementById('correo').value;
        const password = document.getElementById('password').value;

        // Validamos usando el objeto 'utileria'
        const correoEsValido = utileria.validarCorreo(correo);
        const passwordEsValida = utileria.validarPassword(password);

        if (!correoEsValido) {
            Toast.error('Por favor ingresa un correo electrónico válido.', { 
                title: 'Correo inválido' 
            });
            return; 
        }

        if (!passwordEsValida) {
            Toast.warning('La contraseña debe tener al menos 8 caracteres, incluir una mayúscula, una minúscula, un número y un carácter especial.', { 
                title: 'Contraseña débil',
                duration: 6000 
            });
            return; 
        }
        
        Toast.success('Redirigiendo a tu cuenta...', { 
            title: '¡Datos correctos!',
            duration: 1500
        });

        // Guardamos el correo para mostrarlo en index.html
        sessionStorage.setItem('usuario', correo);

        // Esperamos un momento para que se vea el Toast y luego redirigimos
        setTimeout(function() {
            window.location.href = 'index.html';
        }, 1500);
    });
    </script>
</body>
</html>
