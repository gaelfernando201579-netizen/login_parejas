<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/login.css">
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">

    <div class="contenedor-formulario card shadow p-4" style="width: 100%; max-width: 400px;">
        <h1 class="h3 text-center mb-4">Iniciar Sesión</h1>
        
        <form id="loginForm" class="formulario">
            <div class="grupo-formulario mb-3">
                <label for="correo" class="form-label">Correo electrónico</label>
                <input type="email" id="correo" class="form-control" required>
            </div>
            
            <div class="grupo-formulario mb-3">
                <label for="password" class="form-label">Contraseña</label>
                <input type="password" id="password" class="form-control" required>
            </div>
            
            <button type="submit" class="BInicio btn btn-primary w-100">
                Ingresar
            </button>
        </form>
    </div>

    <script src="js/login.js"></script>
</body>
</html>
