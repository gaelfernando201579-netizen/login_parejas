<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pantalla principal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="icon" type="image/png" href="img/image.png">
    <link rel="stylesheet" href="css/componente.css">
</head>
<body>

    <div class="d-flex" id="wrapper">
        <div class="bg-dark border-end text-white p-3" id="sidebar-wrapper" style="width: 260px; min-height: 100vh;">
            <h4 class="text-center py-3 border-bottom">Bienvenido</h4>
            <ul class="nav flex-column mt-3">
                <li class="nav-item mb-2">
                    <a href="index.html" class="nav-link text-white">Inicio</a>
                </li>
                <li class="nav-item mb-2">
                    <a class="nav-link text-white dropdown-toggle" data-bs-toggle="collapse" href="#menuUsuarios" role="button">
                        Usuarios
                    </a>
                    <div class="collapse ps-3" id="menuUsuarios">
                        <ul class="nav flex-column">
                            <li class="nav-item">
                                <a class="nav-link text-light py-1" href="#">Captura</a>
                            </li>
                        </ul>
                    </div>
                </li>
            </ul>
        </div>

        <div id="page-content-wrapper" class="w-100">
            <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom px-4">
                <!-- Botón hamburguesa  -->
                <button class="btn btn-outline-secondary btn-sm me-3" id="sidebarToggle">☰</button>
                
                <div class="ms-auto">
                    <ul class="navbar-nav">
                        <!-- Navbar  -->
                        <li class="nav-item dropdown">
                            <a class="nav-link dropdown-toggle fw-bold" href="#" id="navbarDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                                <span id="spanUsuario">Usuario</span>
                            </a>
                            <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="navbarDropdown">
                                <li><a class="dropdown-item text-danger" href="login.html" id="btnSalir">Salir del sistema</a></li>
                            </ul>
                        </li>
                    </ul>
                </div>
            </nav>

            <div class="container-fluid px-4 py-4">
                <!-- TÍTULO CENTRADO -->
                <h2 class="text-center mb-4">Bienvenido al sistema</h2>

                <!-- ============ FORMULARIO ALUMNOS CENTRADO ============ -->
                <div class="row justify-content-center">
                    <div class="col-12 col-md-8 col-lg-6">
                        <div class="card shadow-sm mx-auto" style="max-width: 500px;">
                            <div class="card-header bg-white">
                                <h3 class="h5 mb-0">Alumnos</h3>
                            </div>
                            <div class="card-body">
                                <!-- novalidate: las validaciones las hacemos nosotros y los errores salen en Toast -->
                                <form id="formAlumnos" novalidate>
                                    <div class="mb-3">
                                        <label for="nombre" class="form-label">Nombre del alumno</label>
                                        <input type="text" id="nombre" class="form-control" placeholder="Ej. Ana López">
                                    </div>
                                    <div class="mb-3">
                                        <label for="numControl" class="form-label">Número de control</label>
                                        <input type="text" id="numControl" class="form-control"
                                               inputmode="numeric" maxlength="6" placeholder="6 dígitos">
                                        <div class="form-text">Exactamente 6 dígitos numéricos.</div>
                                    </div>
                                    <div class="mb-3">
                                        <label for="fechaNacimiento" class="form-label">Fecha de nacimiento</label>
                                        <input type="date" id="fechaNacimiento" class="form-control">
                                    </div>
                                    <button type="submit" class="btn btn-primary w-100">Guardar alumno</button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/sarailunacenobio05-cpu/Actividad-2-Utileria.js/js/utileria.js"></script>
    <script src="js/componente.js"></script>

    <!-- ============ MODAL DE EDAD ============ -->
    <div class="modal fade" id="modalEdad" tabindex="-1" aria-labelledby="modalEdadLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalEdadLabel">Resultado de Registro</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" id="modalEdadBody">
                    <!-- Se llena dinámicamente con JavaScript -->
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Si no hay sesión, regresa al login
        const usuario = sessionStorage.getItem('usuario');
        if (!usuario) {
            window.location.href = 'login.html';
        }

        // Mostrar el correo en la barra superior
        document.getElementById('spanUsuario').textContent = usuario;

        // Salir del sistema: borra la sesión (el enlace ya lleva a login.html)
        document.getElementById('btnSalir').addEventListener('click', function() {
            sessionStorage.removeItem('usuario');
        });

        // Mostrar u ocultar la barra lateral con el botón ☰
        document.getElementById('sidebarToggle').addEventListener('click', function() {
            const sidebar = document.getElementById('sidebar-wrapper');
            sidebar.classList.toggle('d-none');
        });

        // ---------- Formulario Alumnos ----------
        const formAlumnos = document.getElementById('formAlumnos');
        const inputNombre = document.getElementById('nombre');
        const inputControl = document.getElementById('numControl');
        const inputFecha = document.getElementById('fechaNacimiento');
 
        // El calendario no deja elegir fechas futuras
        const hoy = new Date();
        inputFecha.max = hoy.getFullYear() + '-'
            + String(hoy.getMonth() + 1).padStart(2, '0') + '-'
            + String(hoy.getDate()).padStart(2, '0');
 
        function validarNumeroControl(valor) {
            return /^\d+$/.test(valor)
                && utileria.validarLongitud(valor, 6)
                && !utileria.validarLongitud(valor, 5);
        }
 
        // Mientras escribe, el número de control solo acepta dígitos
        inputControl.addEventListener('input', function() {
            inputControl.value = inputControl.value.replace(/\D/g, '');
        });
 
        // Quita el borde rojo en cuanto el usuario vuelve a escribir
        [inputNombre, inputControl, inputFecha].forEach(function(input) {
            input.addEventListener('input', function() {
                input.classList.remove('is-invalid');
            });
        });
 
        // Marca el campo en rojo, muestra el Toast y lleva el foco al campo
        function mostrarError(input, titulo, mensaje) {
            input.classList.add('is-invalid');
            input.focus();
            Toast.error(mensaje, { title: titulo });
        }
 
        formAlumnos.addEventListener('submit', function(evento) {
            evento.preventDefault();
 
            const nombre = inputNombre.value.trim();
            const numControl = inputControl.value.trim();
            const fecha = inputFecha.value; // formato AAAA-MM-DD
 
            if (nombre === '' || !utileria.soloLetras(nombre)) {
                mostrarError(inputNombre, 'Nombre inválido', 'El nombre solo puede contener letras y espacios.');
                return;
            }
 
            if (!validarNumeroControl(numControl)) {
                mostrarError(inputControl, 'Número de control inválido', 'El número de control debe tener exactamente 6 dígitos.');
                return;
            }
 
            if (fecha === '') {
                mostrarError(inputFecha, 'Fecha requerida', 'Selecciona la fecha de nacimiento.');
                return;
            }
 
            const edad = utileria.calcularEdad(fecha + 'T00:00:00');
 
            if (edad < 0 || edad > 120) {
                mostrarError(inputFecha, 'Fecha inválida', 'La fecha de nacimiento no es válida.');
                return;
            }
 
            // Determinar si es mayor o menor de edad
            const esMayor = edad >= 18;
            const estadoEdad = esMayor ? '<span class="text-success fw-bold">Mayor de edad</span>' : '<span class="text-warning fw-bold">Menor de edad</span>';

            // Rellenar la información dentro del Modal
            document.getElementById('modalEdadBody').innerHTML = `
                <p><strong>Alumno:</strong> ${nombre}</p>
                <p><strong>No. de Control:</strong> ${numControl}</p>
                <p><strong>Edad calculada:</strong> ${edad} años</p>
                <hr>
                <p class="mb-0 fs-5">Clasificación: ${estadoEdad}</p>
            `;

            // Mostrar el Modal
            const modalElement = document.getElementById('modalEdad');
            const modalBootstrap = new bootstrap.Modal(modalElement);
            modalBootstrap.show();

            Toast.success('¡Alumno registrado correctamente!', { title: 'Éxito' });
            formAlumnos.reset();
        });
    </script>
</body>
</html>
