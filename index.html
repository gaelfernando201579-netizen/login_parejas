<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pantalla principal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="icon" type="image/png" href="img/image.png">
    <link rel="stylesheet" href="css/componente.css">
</head>
<body>

    <div class="d-flex" id="wrapper">
        <div class="bg-dark border-end text-white p-3" id="sidebar-wrapper" style="width: 260px; min-height: 100vh;">
            <h4 class="text-center py-3 border-bottom">Bienvenido</h4>
            <ul class="nav flex-column mt-3">
                <li class="nav-item mb-2">
                    <a href="index.html" class="nav-link text-white">Inicio</a>
                </li>
                <li class="nav-item mb-2">
                    <a class="nav-link text-white dropdown-toggle" data-bs-toggle="collapse" href="#menuUsuarios" role="button">
                        Usuarios
                    </a>
                    <div class="collapse ps-3" id="menuUsuarios">
                        <ul class="nav flex-column">
                            <li class="nav-item">
                                <a class="nav-link text-light py-1" href="#" id="navCaptura">Captura</a>
                            </li>
                        </ul>
                    </div>
                </li>
            </ul>
        </div>

        <div id="page-content-wrapper" class="w-100">
            <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom px-4">
                <!-- Botón hamburguesa  -->
                <button class="btn btn-outline-secondary btn-sm me-3" id="sidebarToggle">☰</button>
                
                <div class="ms-auto">
                    <ul class="navbar-nav">
                        <!-- Navbar  -->
                        <li class="nav-item dropdown">
                            <a class="nav-link dropdown-toggle fw-bold" href="#" id="navbarDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                                <span id="spanUsuario">Usuario</span>
                            </a>
                            <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="navbarDropdown">
                                <li><a class="dropdown-item text-danger" href="login.html" id="btnSalir">Salir del sistema</a></li>
                            </ul>
                        </li>
                    </ul>
                </div>
            </nav>

            <div class="container-fluid px-4 py-4" id="contenidoPrincipal">
                <h2>Bienvenido al sistema</h2>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/sarailunacenobio05-cpu/Actividad-2-Utileria.js/js/utileria.js"></script>
    <script src="js/componente.js"></script>
    <script>
        // Si no hay sesión, regresa al login
        const usuario = sessionStorage.getItem('usuario');
        if (!usuario) {
            window.location.href = 'login.html';
        }

        // Mostrar el correo en la barra superior
        document.getElementById('spanUsuario').textContent = usuario;

        // Salir del sistema: borra la sesión
        document.getElementById('btnSalir').addEventListener('click', function() {
            sessionStorage.removeItem('usuario');
        });

        // Mostrar u ocultar la barra lateral con el botón ☰
        document.getElementById('sidebarToggle').addEventListener('click', function() {
            const sidebar = document.getElementById('sidebar-wrapper');
            sidebar.classList.toggle('d-none');
        });

    
        // Cargar vista de Captura de Usuarios 
        document.getElementById('navCaptura').addEventListener('click', function(e) {
            e.preventDefault();
            document.getElementById('contenidoPrincipal').innerHTML = `
                <div class="d-flex flex-column align-items-center justify-content-center w-150 py-4">
                    <h2 class="mb-4 text-center">Registro de Usuarios</h2>
                    <div class="card shadow-sm p-4 w-100" style="max-width: 500px;">
                        <form id="formCaptura">
                            <div class="mb-3">
                                <label for="txtNombre" class="form-label">Nombre completo</label>
                                <input type="text" class="form-control" id="txtNombre" required>
                            </div>
                            <div class="mb-3">
                                <label for="txtCorreo" class="form-label">Correo electrónico</label>
                                <input type="text" class="form-control" id="txtCorreo" placeholder="ejemplo@correo.com" required>
                            </div>
                            <div class="mb-3">
                                <label for="txtPassword" class="form-label">Contraseña</label>
                                <input type="password" class="form-control" id="txtPassword" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Guardar Usuario</button>
                        </form>
                    </div>
                </div>
            `;

            // Lógica al enviar el formulario con validación y Toast
            document.getElementById('formCaptura').addEventListener('submit', function(ev) {
                ev.preventDefault();
                const nombre = document.getElementById('txtNombre').value.trim();
                const correo = document.getElementById('txtCorreo').value.trim();
                const password = document.getElementById('txtPassword').value;

                // Validaciones usando la utilería
                const correoEsValido = utileria.validarCorreo(correo);
                const passwordEsValida = utileria.validarPassword(password);

                if (!nombre) {
                    Toast.warning('Por favor ingresa el nombre completo.', { title: 'Campo vacío' });
                    return;
                }

                if (!correoEsValido) {
                    Toast.error('Por favor ingresa un correo electrónico válido.', { title: 'Correo inválido' });
                    return;
                }

                if (!passwordEsValida) {
                    Toast.warning('La contraseña debe tener al menos 8 caracteres, incluir una mayúscula, una minúscula, un número y un carácter especial.', { 
                        title: 'Contraseña débil',
                        duration: 6000 
                    });
                    return;
                }

                Toast.success('¡Usuario registrado correctamente!', { 
                    title: 'Éxito',
                    duration: 2000
                });

                this.reset();
            });
        });
    </script>
</body>
</html>
